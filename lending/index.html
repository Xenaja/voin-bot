<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Саша Боцман — Код воина</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo-wrap {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #c9a84c;
      box-shadow: 0 0 26px rgba(201, 168, 76, 0.22);
      margin-bottom: 14px;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      margin-bottom: 4px;
    }

    .title {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
    }

    /* Реквизиты — первый смысловой блок, до кнопок */
    .support {
      width: 100%;
      margin-top: 18px;
    }

    .support-text {
      font-size: 14px;
      line-height: 1.5;
      color: #d9d0c0;
      margin-bottom: 12px;
    }

    .pay {
      width: 100%;
      text-align: left;
    }

    .pay + .pay {
      margin-top: 12px;
    }

    .pay-title {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a8275;
      margin-bottom: 6px;
    }

    .pay-title b {
      color: #c9a84c;
      font-weight: 600;
    }

    .copy {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-family: 'Arial', sans-serif;
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }

    .copy + .copy {
      margin-top: 6px;
    }

    .copy:hover {
      background: rgba(201, 168, 76, 0.15);
    }

    .copy-label {
      flex-shrink: 0;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a8275;
    }

    .copy-value {
      flex: 1;
      text-align: right;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .copy svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(201, 168, 76, 0.25);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Arial', sans-serif;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, background 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-tg {
      background-color: #c9a84c;
      color: #0d0d0d;
    }

    .btn-merch {
      background: transparent;
      color: #c9a84c;
      border: 1px solid rgba(201, 168, 76, 0.5);
    }

    .btn-merch:hover {
      background: rgba(201, 168, 76, 0.1);
      opacity: 1;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .fallback {
      font-size: 12px;
      line-height: 1.4;
      color: #8a8275;
      margin-top: 12px;
    }

    .fallback a {
      color: #c9a84c;
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 10px);
      background: #c9a84c;
      color: #0d0d0d;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Низкие экраны: ужимаем ещё, чтобы всё осталось в один экран */
    @media (max-height: 700px) {
      .photo-wrap {
        width: 88px;
        height: 88px;
        margin-bottom: 10px;
      }

      .name {
        font-size: 20px;
      }

      .support {
        margin-top: 14px;
      }

      .support-text {
        margin-bottom: 10px;
      }

      .links {
        margin-top: 14px;
        padding-top: 14px;
      }

      .btn {
        padding: 11px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    // Копирование реквизитов: значение берётся из data-copy.
    (function () {
      var toast = document.getElementById('toast');
      var timer = null;

      function showToast() {
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 1500);
      }

      function fallbackCopy(value) {
        var input = document.createElement('textarea');
        input.value = value;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(input);
      }

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-copy]');
        if (!btn) return;
        var value = btn.getAttribute('data-copy');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(value).then(showToast, function () {
            fallbackCopy(value);
            showToast();
          });
        } else {
          fallbackCopy(value);
          showToast();
        }
      });
    })();
  </script>

</html>
