<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Саша Боцман — Код воина</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 40px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo-wrap {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #c9a84c;
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.25);
      margin-bottom: 28px;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      margin-bottom: 8px;
    }

    .title {
      font-size: 15px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 32px;
    }

    .text {
      font-size: 19px;
      line-height: 1.7;
      color: #d9d0c0;
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 6px;
      font-size: 18px;
      font-family: 'Arial', sans-serif;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-tg {
      background-color: #c9a84c;
      color: #0d0d0d;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .fallback {
      font-size: 14px;
      line-height: 1.5;
      color: #8a8275;
      margin-top: 16px;
    }

    .fallback a {
      color: #c9a84c;
      text-decoration: none;
    }

    .support {
      width: 100%;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid rgba(201, 168, 76, 0.25);
    }

    .support-text {
      font-size: 16px;
      line-height: 1.6;
      color: #d9d0c0;
      margin-bottom: 24px;
    }

    .pay {
      width: 100%;
      margin-bottom: 24px;
    }

    .pay:last-child {
      margin-bottom: 0;
    }

    .pay-title {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8a8275;
      margin-bottom: 12px;
    }

    .copy {
      display: block;
      width: 100%;
      font-family: 'Arial', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 6px;
      padding: 13px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy:hover {
      background: rgba(201, 168, 76, 0.15);
    }

    .copy:last-of-type {
      margin-bottom: 0;
    }

    .copy small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a8275;
      margin-bottom: 4px;
    }

    .pay-note {
      font-size: 14px;
      line-height: 1.5;
      color: #8a8275;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 10px);
      background: #c9a84c;
      color: #0d0d0d;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="photo-wrap">
      <img src="photo-sasha.JPG" alt="Саша Боцман">
    </div>

    <div class="name">Саша Боцман</div>
    <div class="title">Код воина</div>

    <p class="text">
      Переходи в мой клуб:
    </p>

    <div class="buttons">
      <a id="tg-btn" href="https://t.me/voinbotsman" class="btn btn-tg">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-2.044 9.63c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.17 14.31l-2.95-.924c-.64-.204-.657-.64.136-.95l11.57-4.461c.537-.194 1.006.131.968.246z"/>
        </svg>
        Telegram
      </a>
    </div>

    <p class="fallback">
      Если ссылка не открылась: <a href="https://t.me/voinbotsman">@voinbotsman</a>
    </p>

    <div class="support">
      <p class="support-text">
        Мне очень хочется развивать блог и продолжать реабилитацию 💪<br>
        Помочь мне можно донатом:
      </p>

      <div class="pay">
        <div class="pay-title">Сбер</div>
        <button type="button" class="copy" data-copy="+79835556909">
          <small>СБП</small>+7 983 555 69 09
        </button>
        <button type="button" class="copy" data-copy="2202208596023219">
          <small>Карта</small>2202 2085 9602 3219
        </button>
        <p class="pay-note">Александр Б — с пометкой «на лечение»</p>
      </div>

      <div class="pay">
        <div class="pay-title">Для иностранных платежей</div>
        <button type="button" class="copy" data-copy="4400430356930625">
          <small>Kaspi, Казахстан</small>4400 4303 5693 0625
        </button>
        <p class="pay-note">ALEXANDR BOTSMAN</p>
      </div>
    </div>

  </div>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    // Копирование реквизитов: значение берётся из data-copy.
    (function () {
      var toast = document.getElementById('toast');
      var timer = null;

      function showToast() {
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 1500);
      }

      function fallbackCopy(value) {
        var input = document.createElement('textarea');
        input.value = value;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(input);
      }

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-copy]');
        if (!btn) return;
        var value = btn.getAttribute('data-copy');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(value).then(showToast, function () {
            fallbackCopy(value);
            showToast();
          });
        } else {
          fallbackCopy(value);
          showToast();
        }
      });
    })();
  </script>
</body>
</html>
